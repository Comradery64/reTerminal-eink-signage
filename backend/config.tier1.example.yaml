# Complete Tier 1 (plain binary + systemd) example config — no Kubernetes anywhere in this file.
# See docs/DEPLOY-TIERS.md for the full tier table and install runbook, and
# backend/deploy/systemd/README.md for the unit files this config is meant to run under.
#
# Copy to /etc/meeting-displays/config.yaml (mode 0600 — it can contain password/token hashes),
# fill in the REPLACE_* values, and point systemd's ExecStart at it (already done in
# backend/deploy/systemd/meeting-displays-broker.service).
listen: ":8080"

poll_interval: "2m"

wake:
  business_hours_seconds: 600
  off_hours_seconds: 3600
  business_start_hour: 7
  business_end_hour: 20
  timezone: "America/New_York"      # REPLACE with your own IANA timezone
  forced_refresh_hour: 3

render:
  width: 800
  height: 480
  dither: true

provider: "google"

google:
  # Tier 1 has no kubelet to mint a projected token, so the broker's own OIDC issuer (the
  # `wiftoken` tool, see docs/GOOGLE-AUTH.md) plays that role instead. This external-account cred
  # config's credential_source.file must match wiftoken.service's `-out` path exactly.
  credentials_file: "/etc/meeting-displays/gcp/cred-config.json"

alerts:
  low_battery_pct: 45
  clear_pct: 55
  min_renotify: "24h"
  webhook_url: "${ALERT_WEBHOOK_URL}"   # set in /etc/meeting-displays/broker.env — see broker.env.example
  stale_after: "1h"

firmware:
  version: ""
  url: ""
  dir: ""

# Fleet-wide Wi-Fi for the /admin "Add a device" provisioning wizard. Leave both empty to keep
# provisioning on tools/provision_device.sh. The PSK is a secret — keep the ${VAR} reference and
# set MD_WIFI_PSK in /etc/meeting-displays/broker.env, never inline here.
fleet:
  wifi_ssid: ""
  wifi_psk: "${MD_WIFI_PSK}"

# Tier 1 has no Prometheus/Grafana by default — sqlite is recommended so the battery curve and
# refresh counts survive a restart (systemd StateDirectory gives this path correct ownership; see
# deploy/systemd/meeting-displays-broker.service's StateDirectory=meeting-displays).
telemetry:
  backend: "sqlite"
  sqlite:
    path: "/var/lib/meeting-displays/telemetry.db"
    retention_days: 90
    prune_interval: "6h"
    queue_size: 256

# No in-cluster API to auto-detect here, so this resolves to "file" either way — spelled out
# explicitly (rather than left as "auto") so a `systemctl cat` shows the real behavior at a glance.
# ReadWritePaths=/etc/meeting-displays in the systemd unit is what makes this writable at all
# under ProtectSystem=strict; see deploy/systemd/README.md if a save ever fails.
config_persistence:
  mode: "file"
  file:
    path: ""                  # empty = write back to /etc/meeting-displays/config.yaml (the -config path)

auth:
  # >=32 bytes; deploy-time sanity check, not used for signing (sessions are server-side).
  session_secret: "${SESSION_SECRET}"   # set in /etc/meeting-displays/broker.env

users:   # REPLACE with your own first admin account
  - username: "admin"
    password_sha256: "REPLACE_WITH_SHA256_OF_ADMIN_PASSWORD"
    role: "admin"

rooms:   # REPLACE with your own rooms; token_sha256 = hash only, generated by tools/provision_all.sh
  - device_id: "rt-example-a"
    name: "Aspen"
    room: "aspen@example.com"
    token_sha256: "REPLACE_WITH_SHA256_OF_DEVICE_TOKEN"
  - device_id: "rt-example-b"
    name: "Birch"
    room: "birch@example.com"
    token_sha256: "REPLACE_WITH_SHA256_OF_DEVICE_TOKEN"
