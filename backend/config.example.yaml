# Broker configuration. In k3s this is mounted from a ConfigMap; secrets come from env / Secret.
# On Tiers 1/2 (no Kubernetes — see docs/DEPLOY-TIERS.md) it's just a file on disk.
listen: ":8080"

# How often the poller refreshes each room from the calendar provider.
poll_interval: "2m"

# Business-hours-aware wake cadence handed to devices via X-Next-Wake.
wake:
  business_hours_seconds: 600     # 10 min during the work day
  off_hours_seconds: 3600         # 1 hr nights/weekends
  business_start_hour: 7          # local tz
  business_end_hour: 20
  timezone: "America/New_York"
  # Optional anti-ghosting lever: once per day, at this local hour, every device gets one
  # unconditional full repaint even if the room schedule hasn't changed (the panel always does a
  # full, not partial, refresh — see firmware/main/epd_spectra6.cpp). E-ink retains a faint image
  # bias when it sits on the same frame for a long time; this clears it before it's visible. Pick
  # an off-hours value (outside business_start_hour..business_end_hour). Omit to disable (default).
  forced_refresh_hour: 3

render:
  width: 800
  height: 480
  dither: true                    # Floyd–Steinberg onto the 6-color palette

# We run Google Workspace. ("demo" is also valid — built-in fake schedule for local testing.)
provider: "google"

google:
  # KEYLESS (Workload Identity Federation). Points at the external-account cred config that
  # references the broker's projected k8s token — no service-account key, no impersonation.
  # The service account reads each room via the freeBusy API after being granted freeBusyReader
  # on that room's calendar (shared directly — see docs/DEPLOY.md). Empty → GOOGLE_APPLICATION_CREDENTIALS.
  credentials_file: "/etc/gcp/cred-config.json"

# Low-battery alert to the building manager (in-broker path). Complementary to the Prometheus
# rule in deploy/k3s/alerts.yaml — run either or both.
alerts:
  low_battery_pct: 45        # fire at/below this; 45 (not 40) gives buffer since LiPo %→V is nonlinear
  clear_pct: 55              # re-arm only after charging back above this (hysteresis)
  min_renotify: "24h"        # if still low, remind at most once per day
  # Slack incoming webhook; empty = log only. Left empty so this file starts as-is (see the README
  # quick start). In production put the real URL in a Secret/env file and write "${ALERT_WEBHOOK_URL}"
  # here instead — a ${VAR} whose variable is unset is a startup error, never a silent empty value.
  webhook_url: ""
  stale_after: "1h"          # no telemetry for this long = "stale" on /status; matches DisplayStale below

# OTA firmware rollout (optional). Leave version empty to disable. When set, the broker advertises
# the target build to devices, which self-update if their running build differs. With `dir` set,
# the broker also serves the image at /firmware/<file>. Use signed images (Secure Boot V2).
firmware:
  version: ""                                  # e.g. "1.1.0"
  url: ""                                      # e.g. "https://displays.example.internal/firmware/meeting_display-1.1.0.bin"
  dir: ""                                      # e.g. "/etc/meeting-displays/firmware" to serve images locally
  # The /admin "Add a device" wizard needs bootloader.bin, partition-table.bin, and
  # meeting_display.bin present in `dir` (copy them there after each `idf.py build`).
  # web_tools_url is the ESP Web Tools module the OPERATOR'S BROWSER loads — the broker itself
  # never fetches it. Defaults to the public CDN; on an isolated network, vendor the file into
  # `dir` and point this at "/firmware/esp-web-tools.js".
  web_tools_url: ""                            # "" = https://unpkg.com/esp-web-tools@10/dist/web/install-button.js

# Settings shared by every display, set once here instead of per device. Required by the /admin
# "Add a device" wizard, which bakes these into each unit's NVS at flash time — a single fleet-wide
# value, so a stale SSID can't be hand-typed into one device and not the others. The PSK is a
# secret: keep it as a ${VAR} reference (see webhook_url above) and inject the real value from your
# Secret / .env, never inline. It is never served to a browser — the broker builds the NVS image
# itself (internal/nvs) and hands back only opaque partition bytes.
fleet:
  wifi_ssid: ""                                # e.g. "Corp_IoT"; the network every display joins
  wifi_psk: ""                                 # WPA2 pre-shared key; leave both empty to disable the wizard
                                               # In production: "${MD_WIFI_PSK}", injected from a Secret.

# ─────────────────────────────────────────────────────────────────────────────
# Both blocks below are OPTIONAL. Omitting them entirely reproduces today's behavior exactly:
# telemetry in memory only (wiped on restart), and config writes going to the in-cluster
# ConfigMap when running in k3s and nowhere otherwise. See docs/DEPLOY-TIERS.md for the tiers
# these knobs exist for, and docs/DASHBOARD.md for what the telemetry backends unlock.
# ─────────────────────────────────────────────────────────────────────────────

# telemetry:
#   # "memory"     — default. Latest report per device, in RAM, wiped on restart. Zero files.
#   # "sqlite"     — also append every report to a local SQLite file (pure-Go driver, no cgo), so
#   #                the battery curve and refresh counts survive restarts. Recommended for
#   #                Tiers 1/2 (no Prometheus/Grafana) — see docs/DEPLOY-TIERS.md.
#   # "prometheus" — identical to "memory" in the broker. Declares that history lives in your
#   #                Prometheus, scraped from /metrics (this is Tier 3's default). The broker
#   #                never pushes anywhere — see docs/DASHBOARD.md.
#   backend: "memory"
#   sqlite:
#     path: "/var/lib/meeting-displays/telemetry.db"
#     retention_days: 90        # 0 = keep forever (unbounded growth; not recommended)
#     prune_interval: "6h"
#     queue_size: 256           # in-flight writes buffered off the device POST path

# config_persistence:
#   # Where live /admin and /manager edits are written so they survive a restart.
#   # "auto"      — default. In-cluster -> "configmap"; else "file" if the target is writable;
#   #               else "none" (logged at ERROR). -demo forces "none" (see config.demo.yaml).
#   # "file"      — atomic temp-file + rename into file.path (default: the -config path). This is
#   #               what Tiers 1/2 auto-resolve to — see docs/DEPLOY-TIERS.md.
#   # "configmap" — JSON merge-patch of the in-cluster ConfigMap (today's Tier 3 behavior).
#   # "none"      — read-only/ephemeral. Writes apply in memory; the UI says so on every page.
#   mode: "auto"
#   file:
#     path: ""                  # empty = write back to the file given by -config
#   configmap:
#     namespace: "meeting-displays"
#     name: "broker-config"
#     key: "config.yaml"

# One entry per physical display. device_id is what the firmware sends in the URL.
# room is the calendar resource (room mailbox / Google resource email).
# token_sha256 is the SHA-256 (hex) of the device bearer token (never store the raw token).
rooms:
  - device_id: "rt-lobby-a1"
    name: "Aspen"
    room: "aspen@example.com"
    token_sha256: "REPLACE_WITH_SHA256_OF_DEVICE_TOKEN"
  - device_id: "rt-3f-birch"
    name: "Birch"
    room: "birch@example.com"
    token_sha256: "REPLACE_WITH_SHA256_OF_DEVICE_TOKEN"
