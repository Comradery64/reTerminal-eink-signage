name: image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/image.yml"

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # No docker/setup-qemu-action step here on purpose: the Dockerfile's build stage is pinned
      # to --platform=$BUILDPLATFORM and cross-compiles with CGO_ENABLED=0 via GOARCH, so both
      # target platforms are built natively by the Go toolchain instead of under emulation. If a
      # future edit to the Dockerfile drops that pin, this job will start silently emulating
      # instead of failing loudly — watch for that in review.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
